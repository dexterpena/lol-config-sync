name: Release

# Push a tag like v1.2.0 to publish a release. The app's built-in updater
# looks for the newest release here and downloads its installer or portable zip.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/package.ps1 -Version "${{ github.ref_name }}"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $notes = "release-notes.md"
          # Use this version's section of CHANGELOG.md as the release notes.
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## \[?$([regex]::Escape($version))\]?.*?\r?\n(.*?)(?=^## |\z)")
          if ($match.Success) { $match.Groups[1].Value.Trim() | Set-Content $notes } else { "LoL Config Sync $version" | Set-Content $notes }
          gh release create "${{ github.ref_name }}" dist/*.exe dist/*.zip --title "LoL Config Sync $version" --notes-file $notes
